name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/android_release.py metadata --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          test -f "releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This version already has a release; use a new version tag.' >&2
            exit 1
          fi
      - name: Prepare Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          chmod +x android/gradlew
      - name: Test service
        working-directory: server
        run: node --test
      - name: Test, build and lint Android
        working-directory: android
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :app:lintRelease --no-daemon --console=plain
      - name: Sign and verify release APK
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/android_release.py sign --tag "$RELEASE_TAG"
      - name: Retain exact release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: |
            outputs/release/mediary.apk
            outputs/release/SHA256SUMS
            outputs/release/release-info.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd outputs/release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" mediary.apk SHA256SUMS release-info.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Mediary ${RELEASE_TAG}" --notes-file "../../releases/${RELEASE_TAG}.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
